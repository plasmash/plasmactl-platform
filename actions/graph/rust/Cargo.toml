[package]
name = "platform-graph"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "platform-graph"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
memchr = "2"
minijinja = { version = "2", features = ["loop_controls"] }
petgraph = "0.7"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
