runtime: plugin
action:
  title: Destroy Platform
  icon: delete_forever
  description: "Destroy a platform and all its resources (requires confirmation)"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to destroy
      required: true
  options:
    - name: yes-i-am-sure
      title: Yes I Am Sure
      description: Skip confirmation prompt (for automation)
      type: boolean
      default: false
    - name: keep-dns
      title: Keep DNS
      description: Keep DNS records (don't delete MX, DKIM, DMARC, SPF)
      type: boolean
      default: false
  result:
    type: object
    properties:
      name:
        type: string
      success:
        type: boolean
