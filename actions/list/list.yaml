runtime: plugin
action:
  title: List Platforms
  icon: view_list
  description: "List all platforms in the current repository"
  result:
    type: object
    properties:
      platforms:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              description: Platform name
            domain:
              type: string
              description: DNS domain
            metal_provider:
              type: string
              description: Infrastructure provider (scaleway, hetzner, aws, etc.)
            dns_provider:
              type: string
              description: DNS provider (ovh, cloudflare, gandi, etc.)
            node_count:
              type: integer
              description: Number of nodes
