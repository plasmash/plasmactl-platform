runtime: plugin
action:
  title: List Platforms
  description: "List all platforms in the current repository"
  options:
    - name: output
      shorthand: o
      title: Output Format
      description: Output format (json, yaml). Default is table.
      type: string
      default: ""
  result:
    type: object
    properties:
      platforms:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            domain:
              type: string
            provider:
              type: string
