runtime: plugin
action:
  title: Deploy Platform (Full Workflow)
  icon: publish
  description: "Full workflow: bump → compose → prepare → deploy (local), or trigger CI pipeline"
  arguments:
    - name: name
      title: Name
      required: true
    - name: tags
      title: Tags
      required: true
  options:
    - name: image
      title: Platform Image
      description: Deploy from a Platform Image (.pi) file
      type: string
      default: ""
    - name: last
      title: Last
      description: Last flag for local bump command
      type: boolean
      default: false
    - name: skip-bump
      title: Skip bump
      description: Skip execution of local bump command
      type: boolean
      default: false
    - name: skip-prepare
      title: Skip prepare
      description: Skip execution of prepare command (only works with --local)
      type: boolean
      default: false
    - name: ci
      title: CI
      description: Execute all commands and deploy in CI (default)
      type: boolean
      default: false
    - name: gitlab-domain
      title: Gitlab domain
      description: Gitlab domain to deploy in CI
      type: string
      default: ""
      process:
        - processor: config.GetValue
          options:
            path: platform.deploy.gitlab_domain
    - name: forge-token
      title: Forge token
      description: GitLab PAT (api scope) for CI pipeline triggering; falls back to keyring key release_forge_token
      type: string
      default: ""
    - name: local
      title: Local
      description: Execute compose + sync + deploy locally instead of using CI
      type: boolean
      default: false
    - name: clean
      title: Clean
      description: Clean flag for compose command (only works with --local)
      type: boolean
      default: false
    - name: clean-prepare
      title: Clean prepare
      description: Clean flag for prepare command - removes existing prepare directory (only works with --local)
      type: boolean
      default: false
    - name: debug
      title: Debug
      description: Run Ansible in debug mode
      type: boolean
      default: false
    - name: conflicts-verbosity
      title: Conflicts verbosity
      description: Log files conflicts during composition
      type: boolean
      default: false
  result:
    type: object
    properties:
      mode:
        type: string
        description: "Execution mode: local, ci, or image"
      pipeline:
        type: object
        description: CI pipeline details (CI mode only)
        properties:
          id:
            type: integer
            description: Pipeline ID
          job_id:
            type: integer
            description: Job ID
