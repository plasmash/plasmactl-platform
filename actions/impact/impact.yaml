runtime: plugin
action:
  title: Impact Analysis
  icon: track_changes
  description: "Analyze the blast radius of changing or removing any graph node: component, variable, zone, node, package, or flow"
  arguments:
    - name: identifier
      title: Identifier
      description: "The graph node identifier to analyze (component, variable, zone, node, package, or flow)"
      required: true
  result:
    type: object
    properties:
      name:
        type: string
        description: Name of the analyzed entity
      node_type:
        type: string
        description: "Graph node type (component, variable, zone, node, package)"
      node_kind:
        type: string
        description: "Specific kind (application, service, etc.)"
      direct:
        type: array
        description: Direct impact entries
        items:
          type: object
          properties:
            category:
              type: string
              description: Impact category name
            count:
              type: integer
              description: Number of items in this category
            items:
              type: array
              description: List of affected items
              items:
                type: string
      transitive:
        type: array
        description: Transitive impact entries
        items:
          type: object
          properties:
            category:
              type: string
              description: Impact category name
            count:
              type: integer
              description: Number of items in this category
            items:
              type: array
              description: List of affected items
              items:
                type: string
