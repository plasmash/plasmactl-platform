runtime: plugin
action:
  title: Validate Platform
  icon: verified
  description: "Validate platform configuration including DNS propagation and mail authentication"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to validate
      required: true
  options:
    - name: skip-dns
      title: Skip DNS
      description: Skip DNS validation
      type: boolean
      default: false
    - name: skip-mail
      title: Skip Mail
      description: Skip mail authentication validation (DKIM, DMARC, SPF)
      type: boolean
      default: false
  result:
    type: object
    properties:
      name:
        type: string
      valid:
        type: boolean
      checks:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            status:
              type: string
            value:
              type: string
      node_count:
        type: integer
      has_errors:
        type: boolean
      has_warnings:
        type: boolean
