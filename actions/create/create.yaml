runtime: plugin
action:
  title: Create Platform
  description: "Create a new platform scaffold with platform.yaml and nodes/ directory"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to create
      required: true
  options:
    - name: metal-provider
      shorthand: m
      title: Metal Provider
      description: Infrastructure provider for bare metal/VMs (scaleway, hetzner, aws, ovh, gcp, azure, manual)
      type: string
      default: "manual"
    - name: dns-provider
      title: DNS Provider
      description: DNS provider for domain configuration (ovh, cloudflare, gandi, inwx, manual)
      type: string
      default: "manual"
    - name: domain
      shorthand: d
      title: Domain
      description: Domain name for the platform
      type: string
      required: true
    - name: zone
      title: Zone
      description: Infrastructure zone (e.g., fr-par-2 for Scaleway, fsn1 for Hetzner, eu-west-1a for AWS)
      type: string
      default: ""
    - name: region
      title: Region
      description: Infrastructure region (e.g., eu-west-1 for AWS)
      type: string
      default: ""
    - name: project-id
      title: Project ID
      description: Provider project ID (e.g., Scaleway project ID)
      type: string
      default: ""
    - name: image
      title: Image
      description: Server image (e.g., ubuntu-24.04 for Hetzner, ami-xxx for AWS)
      type: string
      default: ""
    - name: ssh-key-id
      title: SSH Key ID
      description: SSH key identifier for the provider
      type: string
      default: ""
    - name: skip-dns
      title: Skip DNS
      description: Skip DNS configuration during provisioning
      type: boolean
      default: false
