runtime: plugin
action:
  title: Show Platform
  icon: visibility
  description: "Show details of a platform including configuration and nodes"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to show
      required: true
  result:
    type: object
    properties:
      platform:
        type: object
      nodes:
        type: array
        items:
          type: string
      dns:
        type: object
        properties:
          provider:
            type: string
          domain:
            type: string
          configured:
            type: boolean
