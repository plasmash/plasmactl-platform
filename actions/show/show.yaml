runtime: plugin
action:
  title: Show Platform
  description: "Show details of a platform including configuration and nodes"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to show
      required: true
  options:
    - name: output
      shorthand: o
      title: Output Format
      description: Output format (json, yaml). Default is human-readable.
      type: string
      default: ""
  result:
    type: object
    properties:
      platform:
        type: object
      nodes:
        type: array
        items:
          type: string
      dns:
        type: object
        properties:
          provider:
            type: string
          domain:
            type: string
          configured:
            type: boolean
