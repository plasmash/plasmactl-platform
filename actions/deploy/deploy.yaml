runtime: plugin
action:
  title: Deploy Platform
  icon: rocket_launch
  description: Deploy Ansible resources to target cluster
  arguments:
    - name: name
      title: Name
      description: The platform to deploy to
      required: true
    - name: tags
      title: Tags
      description: The Ansible resources to deploy (comma-separated)
      required: true
  options:
    - name: image
      title: Platform Image
      description: Deploy from a Platform Image (.pm) file
      type: string
      default: ""
    - name: debug
      title: Debug
      description: Run ansible-playbook in verbose mode (-vvv)
      type: boolean
      default: false
    - name: check
      title: Check
      description: Run ansible-playbook in check mode (dry-run)
      type: boolean
      default: false
    - name: password
      title: Vault Password
      description: Ansible vault password
      process:
        - processor: keyring.GetKeyValue
          options:
            key: vaultpass
      default: ""
    - name: logs
      title: Logs
      description: Store output in deploy.log file
      type: boolean
      default: false
    - name: prepare-dir
      title: Prepare Directory
      description: Directory containing prepared model
      type: string
      default: ".plasma/prepare"
  result:
    type: object
    properties:
      name:
        type: string
      tags:
        type: string
      success:
        type: boolean
