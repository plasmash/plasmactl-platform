runtime: plugin
action:
  title: Check Platform
  description: "Run comprehensive graph-powered validations across all platform aspects: components, model, chassis, nodes, variables, and flows"
  options:
    - name: section
      title: Section
      description: "Run only a specific validation section (components, model, chassis, nodes, variables, flows)"
      type: string
      default: ""
  result:
    type: object
    properties:
      sections:
        type: array
        description: Validation results per section
        items:
          type: object
          properties:
            id:
              type: string
              description: Section identifier for layout switching (components, model, chassis, nodes, variables, flows)
            name:
              type: string
              description: Human-readable section name
            passed:
              type: integer
              description: Number of checks passed
            errors:
              type: integer
              description: Number of errors found
            warnings:
              type: integer
              description: Number of warnings found
            findings:
              type: array
              description: List of findings
              items:
                type: object
                properties:
                  section:
                    type: string
                    description: Section identifier
                  severity:
                    type: string
                    description: "Finding severity: error, warning, or info"
                  message:
                    type: string
                    description: Finding message
                  details:
                    type: array
                    description: Additional details
                    items:
                      type: string
      total_errors:
        type: integer
        description: Total number of errors found
      total_warnings:
        type: integer
        description: Total number of warnings found
